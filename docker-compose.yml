version: '3.8'

services:
  mtc-dam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtc-dam
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET:-mtc-dam-production-secret-change-me}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_USERNAME=${NEXTCLOUD_USERNAME}
      - NEXTCLOUD_PASSWORD=${NEXTCLOUD_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_SECURE=${SMTP_SECURE:-false}
    devices:
      # Hardware GPU acceleration (Intel QuickSync / VAAPI, CoffeeLake GT2 UHD 630)
      - /dev/dri:/dev/dri
    volumes:
      # Persistent volume for SQLite database
      - dam_db_data:/app/data
      # Persistent volume for uploaded media files (local storage fallback)
      - dam_media_storage:/app/public/storage

  # Cloudflare Tunnel: Exposes your DAM securely to the internet with custom domain & free SSL
  # Run with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mtc-dam-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - mtc-dam
    profiles:
      - tunnel

volumes:
  dam_db_data:
  dam_media_storage:
